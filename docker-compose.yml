version: '3.9'

services:
  app:
    build: .
    container_name: safeclaim_app
    expose:
      - "5000"
    networks:
      - webnet

  nginx:
    image: nginx:stable-alpine
    container_name: safeclaim_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - webnet

networks:
  webnet:
    driver: bridge
